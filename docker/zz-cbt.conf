# Halaman awal langsung ke login (index.php kosong).
# "disabled" wajib lebih dulu, karena mod_dir MENAMBAHKAN (bukan mengganti)
# daftar DirectoryIndex dari konfigurasi bawaan image php:apache.
DirectoryIndex disabled
DirectoryIndex login.php index.php

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Folder yang tidak boleh diakses lewat browser
<Directory /var/www/html/config>
    Require all denied
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/backup_logs>
    Require all denied
</Directory>

# Blokir file non-web yang ikut ter-copy
<FilesMatch "\.(sql|docx|md|ini|log)$">
    Require all denied
</FilesMatch>
