; ==========================================
;  Konfigurasi PHP untuk aplikasi CBT
; ==========================================
date.timezone = Asia/Jakarta

; Upload (import soal/siswa via CSV, dsb)
upload_max_filesize = 32M
post_max_size       = 32M
max_file_uploads    = 50

; Export laporan / backup bisa memakan waktu
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 512M

; Ujian berlangsung lama -> session jangan cepat mati (2 jam)
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.use_strict_mode = 1

; Error tidak ditampilkan ke siswa, tapi tetap masuk log container
display_errors = Off
log_errors     = On
error_log      = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
